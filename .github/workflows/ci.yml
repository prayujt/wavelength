name: CI
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - run: npm ci
        working-directory: web
      - run: npm run generate && git diff --exit-code -- src/gen
        working-directory: web
      - run: npm run check && npm run format:check && npm run build
        working-directory: web
      - run: npx playwright install --with-deps --only-shell chromium
        working-directory: web
      - run: npm test
        working-directory: web
      - run: go test -race -timeout 90s ./internal/auth -run '^TestWebBrowser$'
        env:
          WAVELENGTH_WEB_TESTS: "1"
  api:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - run: test -z "$(gofmt -l cmd internal gen)"
      - run: go vet ./...
      - run: go test -race -timeout 90s ./...
        env:
          WAVELENGTH_REQUIRE_MEDIA_TOOLS: "1"
      - run: CGO_ENABLED=0 go build -o bin/wavelength ./cmd/wavelength
      - run: python3 scripts/smoke.py
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install py-sonic==1.0.3 lxml==5.4.0
      - run: python -m pip install playwright==1.64.1
      - run: python -m playwright install --with-deps --only-shell chromium
      - run: go test -race -timeout 90s ./internal/auth -run '^TestOAuthBrowserConsent$'
        env:
          WAVELENGTH_BROWSER_PYTHON: python
      - run: python scripts/client-compatibility.py
      - run: python scripts/validate-subsonic.py
