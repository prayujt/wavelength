name: CI
on: [push, pull_request]
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - run: test -z "$(gofmt -l cmd internal gen)"
      - run: go vet ./...
      - run: go test -race -timeout 90s ./...
        env:
          WAVELENGTH_REQUIRE_MEDIA_TOOLS: "1"
      - run: CGO_ENABLED=0 go build -o bin/wavelength ./cmd/wavelength
      - run: python3 scripts/smoke.py
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install py-sonic==1.0.3 lxml==5.4.0
      - run: python scripts/client-compatibility.py
      - run: python scripts/validate-subsonic.py
