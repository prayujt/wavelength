<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#0A1111" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <link rel="manifest" href="/app/manifest.webmanifest" />
    <link rel="apple-touch-icon" href="/app/icon-192.png" />
    <title>Wavelength</title>
    <style>
      html,
      body,
      #root {
        height: 100%;
        width: 100%;
        margin: 0;
        background: #0a1111;
      }
      body {
        overflow: hidden;
        overscroll-behavior: none;
      }
      #root {
        position: fixed;
        top: 0;
        left: 0;
        height: 100dvh;
        display: flex;
        flex: 1;
      }
      /* iOS standalone can report a shorter percentage/dynamic viewport when
         drawing behind the status bar. Fill the whole installed-app viewport;
         screens and the tab bar apply safe-area padding to their controls. */
      @media (display-mode: standalone) {
        #root {
          height: 100vh;
          height: 100lvh;
        }
      }
    </style>
  </head>
  <body>
    <noscript>Enable JavaScript to open Wavelength.</noscript>
    <div id="root"></div>
  </body>
</html>
