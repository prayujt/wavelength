syntax = "proto3";
package wavelength.v1;
option go_package = "github.com/prayujt/wavelength/gen/wavelength/v1;wavelengthv1";

import "google/protobuf/timestamp.proto";

// LibraryService is Wavelength's native API. Legacy Subsonic is not part of this contract.
service LibraryService {
  rpc ListTracks(ListTracksRequest) returns (ListTracksResponse);
  rpc GetTrack(GetTrackRequest) returns (GetTrackResponse);
  rpc ListArtists(ListArtistsRequest) returns (ListArtistsResponse);
  rpc GetArtist(GetArtistRequest) returns (GetArtistResponse);
  rpc ListAlbums(ListAlbumsRequest) returns (ListAlbumsResponse);
  rpc GetAlbum(GetAlbumRequest) returns (GetAlbumResponse);
  // Browsers should use this range-capable HTTP path with their existing session cookie.
  rpc GetPlaybackInfo(GetPlaybackInfoRequest) returns (GetPlaybackInfoResponse);
  // Reads lyrics already stored with the track; never queries an external provider.
  rpc GetLyrics(GetLyricsRequest) returns (GetLyricsResponse);
  // Native clients may also consume audio directly over gRPC/Connect server streaming.
  rpc StreamAudio(StreamAudioRequest) returns (stream StreamAudioResponse);
}

// Personal state always belongs to the authenticated OIDC subject. Callers cannot
// supply an owner or impersonate another user. Public playlists are readable by
// other authenticated users; only their owner can change them.
service UserDataService {
  rpc GetCurrentUser(GetCurrentUserRequest) returns (GetCurrentUserResponse);
  rpc ListPlaylists(ListPlaylistsRequest) returns (ListPlaylistsResponse);
  rpc GetPlaylist(GetPlaylistRequest) returns (GetPlaylistResponse);
  rpc CreatePlaylist(CreatePlaylistRequest) returns (GetPlaylistResponse);
  rpc UpdatePlaylist(UpdatePlaylistRequest) returns (GetPlaylistResponse);
  rpc DeletePlaylist(DeletePlaylistRequest) returns (EmptyResponse);
  rpc GetQueue(GetQueueRequest) returns (GetQueueResponse);
  rpc SaveQueue(SaveQueueRequest) returns (GetQueueResponse);
  rpc ListBookmarks(ListBookmarksRequest) returns (ListBookmarksResponse);
  rpc SaveBookmark(SaveBookmarkRequest) returns (EmptyResponse);
  rpc DeleteBookmark(DeleteBookmarkRequest) returns (EmptyResponse);
  rpc GetHistory(GetHistoryRequest) returns (GetHistoryResponse);
  rpc RecordPlay(RecordPlayRequest) returns (EmptyResponse);
  rpc GetNowPlaying(GetNowPlayingRequest) returns (GetNowPlayingResponse);
}
message EmptyResponse {}
message User { string id = 1; string name = 2; string email = 3; }
message GetCurrentUserRequest {}
message GetCurrentUserResponse { User user = 1; }
message Playlist {
  string id = 1; string name = 2; string comment = 3; string owner_id = 4;
  bool public = 5; repeated string track_ids = 6;
  string created_at = 7; string changed_at = 8;
}
message ListPlaylistsRequest { int32 limit = 1; int32 offset = 2; }
message ListPlaylistsResponse { repeated Playlist playlists = 1; int32 total = 2; }
message GetPlaylistRequest { string id = 1; }
message GetPlaylistResponse { Playlist playlist = 1; }
message CreatePlaylistRequest { string name = 1; repeated string track_ids = 2; }
message TrackIDs { repeated string ids = 1; }
message UpdatePlaylistRequest {
  string id = 1; optional string name = 2; optional string comment = 3;
  optional bool public = 4; TrackIDs replace_tracks = 5;
  repeated string add_track_ids = 6; repeated int32 remove_indices = 7;
}
message DeletePlaylistRequest { string id = 1; }
// Playback position is in milliseconds in the native API and MCP.
message Queue {
  repeated string track_ids = 1; string current_track_id = 2;
  int64 position_ms = 3; string changed_at = 4; string changed_by = 5;
}
message GetQueueRequest {}
message GetQueueResponse { Queue queue = 1; }
message SaveQueueRequest { repeated string track_ids = 1; string current_track_id = 2; int64 position_ms = 3; }
message Bookmark { string track_id = 1; int64 position_ms = 2; string comment = 3; string created_at = 4; string changed_at = 5; }
message ListBookmarksRequest { int32 limit = 1; int32 offset = 2; }
message ListBookmarksResponse { repeated Bookmark bookmarks = 1; int32 total = 2; }
message SaveBookmarkRequest { string track_id = 1; int64 position_ms = 2; string comment = 3; }
message DeleteBookmarkRequest { string track_id = 1; }
message GetHistoryRequest { int32 limit = 1; int32 offset = 2; }
message HistoryEntry { string track_id = 1; int32 plays = 2; string last_played_at = 3; }
message GetHistoryResponse { repeated HistoryEntry entries = 1; int32 total = 2; }
message RecordPlayRequest { string track_id = 1; google.protobuf.Timestamp played_at = 2; bool now_playing_only = 3; }
message GetNowPlayingRequest {}
message NowPlaying { string track_id = 1; string played_at = 2; }
message GetNowPlayingResponse { repeated NowPlaying entries = 1; }
message Track {
  string id = 1;
  string title = 2;
  string artist = 3;
  string album = 4;
  string album_artist = 5;
  int32 track_number = 6;
  int32 disc_number = 7;
  int32 year = 8;
  string genre = 9;
  double duration_seconds = 10;
  int64 size_bytes = 11;
  string content_type = 12;
  int32 bit_rate_kbps = 13;
  google.protobuf.Timestamp created_at = 14;
  google.protobuf.Timestamp modified_at = 15;
  // Authenticated image path; returns 404 when no artwork is available.
  string artwork_path = 16;
  // Catalog identities for direct artist and album navigation.
  string artist_id = 17;
  string album_id = 18;
}
message Artist { string id = 1; string name = 2; int32 album_count = 3; string artwork_path = 4; }
message Album {
  string id = 1; string name = 2; string artist_id = 3; string artist = 4;
  int32 year = 5; string genre = 6; int32 track_count = 7;
  double duration_seconds = 8; google.protobuf.Timestamp created_at = 9;
  string artwork_path = 10;
}
message ListTracksRequest { string query = 1; int32 limit = 2; int32 offset = 3; }
message ListTracksResponse { repeated Track tracks = 1; int32 total = 2; }
message GetTrackRequest { string id = 1; }
message GetTrackResponse { Track track = 1; }
message ListArtistsRequest { string query = 1; int32 limit = 2; int32 offset = 3; }
message ListArtistsResponse { repeated Artist artists = 1; int32 total = 2; }
message GetArtistRequest { string id = 1; }
message GetArtistResponse { Artist artist = 1; repeated Album albums = 2; }
message ListAlbumsRequest { string query = 1; string artist_id = 2; int32 limit = 3; int32 offset = 4; }
message ListAlbumsResponse { repeated Album albums = 1; int32 total = 2; }
message GetAlbumRequest { string id = 1; }
message GetAlbumResponse { Album album = 1; repeated Track tracks = 2; }
message GetPlaybackInfoRequest { string id = 1; }
message GetPlaybackInfoResponse { Track track = 1; string http_path = 2; bool supports_ranges = 3; }
message GetLyricsRequest { string id = 1; }
message GetLyricsResponse { string lyrics = 1; }
message StreamAudioRequest { string id = 1; int64 offset_bytes = 2; int64 length_bytes = 3; }
message StreamAudioResponse { bytes data = 1; int64 offset_bytes = 2; }
