syntax = "proto3";
package wavelength.v1;
option go_package = "github.com/prayujt/wavelength/gen/wavelength/v1;wavelengthv1";

import "google/protobuf/timestamp.proto";
import "wavelength/v1/library.proto";

// Listening events describe what a client played, independently of byte delivery.
// All sessions belong to the authenticated listener; writes require wavelength:write.
service ListeningService {
  rpc StartListeningSession(StartListeningSessionRequest) returns (ListeningSession);
  rpc ReportListeningProgress(ReportListeningProgressRequest) returns (ListeningSession);
  rpc FinishListeningSession(FinishListeningSessionRequest) returns (ListeningSession);
  rpc ListListeningSessions(ListListeningSessionsRequest) returns (ListListeningSessionsResponse);
}
message ListeningSession {
  string id = 1;
  // Metadata at the time of playback survives later library changes.
  Track track = 2;
  string artist_id = 3;
  string album_id = 4;
  string origin = 5;
  // Empty while unfinished; completed, skipped, or stopped when explicitly reported.
  string outcome = 6;
  google.protobuf.Timestamp started_at = 7;
  google.protobuf.Timestamp updated_at = 8;
  google.protobuf.Timestamp ended_at = 9;
  int64 listened_ms = 10;
  int64 position_ms = 11;
  bool playing = 12;
}
message StartListeningSessionRequest {
  string track_id = 1;
  // direct, queue, or restored.
  string origin = 2;
  // Stable client-generated ID (8..128 letters, digits, underscores or dashes).
  // Reusing the same ID and input returns the existing session.
  string request_id = 3;
}
message ReportListeningProgressRequest {
  string session_id = 1;
  // Cumulative time actually listened; exclude pauses, buffering and seek jumps.
  int64 listened_ms = 2;
  int64 position_ms = 3;
  bool playing = 4;
}
message FinishListeningSessionRequest {
  string session_id = 1;
  string outcome = 2;
  int64 listened_ms = 3;
  int64 position_ms = 4;
}
message ListListeningSessionsRequest {
  // Optional local catalog IDs; supplied filters are combined.
  string track_id = 1;
  string artist_id = 2;
  string album_id = 3;
  // Session start time: inclusive lower bound and exclusive upper bound.
  google.protobuf.Timestamp since = 4;
  google.protobuf.Timestamp until = 5;
  string origin = 6;
  string outcome = 7;
  int32 limit = 8;
  int32 offset = 9;
}
message ListListeningSessionsResponse {
  repeated ListeningSession sessions = 1;
  int32 total = 2;
}
